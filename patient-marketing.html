<style>
  :root{
    --navy:#0B1629;
    --panel:#101E36;
    --panel-line:#1C2E4D;
    --teal:#1ECFBE;
    --amber:#F5A623;
    --ink:#F2F4F8;
    --ink-dim:#AEB9CC;
    --ink-faint:#7C8AA3;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--navy);
    color:var(--ink);
    font-family:'DM Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:20px;
  }
  .wrap{max-width:880px; margin:0 auto;}

  h1,h2,h3,.eyebrow,.stat-num{
    font-family:'Bebas Neue', 'DM Sans', sans-serif;
    letter-spacing:0.03em;
  }

  a{color:var(--teal);}

  .eyebrow{
    color:var(--teal);
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    margin:0 0 6px 0;
  }

  .hero{padding-block: 48px 32px; border-bottom:1px solid var(--panel-line);}
  .hero-top{display:flex; gap:24px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
  .hero-id{display:flex; gap:20px; align-items:center;}
  .headshot{width:88px; height:88px; border-radius:50%; object-fit:cover; border:2px solid var(--teal); flex-shrink:0;}
  .name{font-size:clamp(40px,7vw,64px); line-height:0.95; margin:0; text-wrap:balance;}
  .role-line{font-family:'DM Sans', sans-serif; font-weight:700; font-size:17px; color:var(--ink); margin:10px 0 4px 0;}
  .role-sub{color:var(--ink-dim); font-size:15px; max-width:56ch; margin:0;}
  .contact-block{text-align:right; font-size:14px; color:var(--ink-dim); display:flex; flex-direction:column; gap:4px; min-width:220px;}
  .contact-block a{text-decoration:none; font-weight:500;}
  .contact-block a:hover{text-decoration:underline;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:36px;}
  .stat{background:var(--panel); border:1px solid var(--panel-line); border-top:3px solid var(--teal); padding:16px 14px;}
  .stat:nth-child(2){border-top-color:var(--amber);}
  .stat:nth-child(4){border-top-color:var(--amber);}
  .stat-num{font-size:clamp(24px,4vw,32px); color:var(--ink); line-height:1; font-variant-numeric:tabular-nums;}
  .stat-label{font-size:12.5px; color:var(--ink-faint); margin-top:6px; line-height:1.35;}

  section{padding-block:34px; border-bottom:1px solid var(--panel-line);}
  section:last-of-type{border-bottom:none;}
  h2.section-title{font-size:26px; color:var(--ink); margin:0 0 18px 0;}
  .lede{color:var(--ink-dim); font-size:15.5px; line-height:1.6; max-width:70ch;}

  .role{display:grid; grid-template-columns:190px 1fr; gap:20px; padding-block:18px; border-top:1px solid var(--panel-line);}
  .role:first-of-type{border-top:none;}
  .role-meta{color:var(--ink-faint); font-size:13px; line-height:1.5;}
  .role-meta .org{color:var(--ink); font-weight:700; font-size:14.5px; display:block; margin-bottom:3px;}
  .role-title{font-weight:700; font-size:15.5px; color:var(--ink); margin:0 0 8px 0;}
  .role ul{margin:0; padding-left:18px; color:var(--ink-dim); font-size:14.5px; line-height:1.65;}
  .role li{margin-bottom:6px;}
  .role li:last-child{margin-bottom:0;}
  .role li b{color:var(--ink); font-weight:700;}
  .role-earlier{padding-top:18px; border-top:1px solid var(--panel-line); color:var(--ink-faint); font-size:14px; line-height:1.7;}
  .role-earlier b{color:var(--ink-dim);}

  .lead-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  .lead-card{background:var(--panel); border:1px solid var(--panel-line); border-left:3px solid var(--teal); padding:16px 18px;}
  .lead-card .org{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--teal); margin:0 0 8px 0;}
  .lead-card p{margin:0; color:var(--ink-dim); font-size:14.5px; line-height:1.6;}

  .cap-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px 28px;}
  .cap h3{font-family:'DM Sans', sans-serif; font-weight:700; font-size:15px; letter-spacing:0.02em; color:var(--amber); margin:0 0 6px 0;}
  .cap p{margin:0; color:var(--ink-dim); font-size:14.5px; line-height:1.6;}

  .cred-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
  .pill{border:1px solid var(--panel-line); background:var(--panel); color:var(--ink-dim); font-size:13px; padding:6px 14px;}
  .edu{color:var(--ink-dim); font-size:14.5px; line-height:1.7;}
  .edu b{color:var(--ink);}

  footer{padding-block:30px 44px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; color:var(--ink-faint); font-size:13px;}
  footer a{color:var(--teal); text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:640px){
    .contact-block{text-align:left; align-items:flex-start;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .role{grid-template-columns:1fr;}
    .lead-grid, .cap-grid{grid-template-columns:1fr;}
    .hero-top{flex-direction:column;}
  }
</style>
</head>
